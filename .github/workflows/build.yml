name: build

# 推 tag 或手动触发时,在云端同时产出 Windows exe 与 Android APK。
# 本地不用装 Linux、也不用装 Android SDK —— 直接下 artifact 即可。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pycaw comtypes pyserial

      - name: 构建
        run: python packaging/build_windows.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: echolink-windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: 缓存 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 构建 debug APK
        run: buildozer -v android debug

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: echolink-android
          path: bin/*.apk
          if-no-files-found: error
